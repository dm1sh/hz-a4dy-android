name: Debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an earlier push: each pushed branch tip should retain its own build.
jobs:
  debug:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Validate wrapper and cache Gradle dependencies
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
      - name: Validate version and CI helpers
        run: |
          python3 tools/ci.py version
          python3 -m unittest discover -s tools/tests -v
      - name: Compile host and device tests
        run: ./gradlew --no-daemon --console=plain :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin
      - name: Run core and Android host tests
        run: ./gradlew --no-daemon --console=plain :core:test :app:testDebugUnitTest
      - name: Lint debug variant
        run: ./gradlew --no-daemon --console=plain :app:lintDebug
      - name: Build commit APKs with separate CI debug signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          A4DY_DEBUG_KEYSTORE: ${{ runner.temp }}/a4dy-debug.p12
          A4DY_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          A4DY_DEBUG_KEY_ALIAS: a4dy-ci-debug
          A4DY_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
        run: |
          trap 'rm -f "$A4DY_DEBUG_KEYSTORE"' EXIT
          python3 tools/ci.py restore-key --kind debug --optional
          if [[ ! -f "$A4DY_DEBUG_KEYSTORE" ]]; then
            unset A4DY_DEBUG_KEYSTORE A4DY_DEBUG_STORE_PASSWORD A4DY_DEBUG_KEY_ALIAS A4DY_DEBUG_KEY_PASSWORD
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build pull-request APKs without repository signing secrets
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APKs and prepare checksums / build metadata
        run: python3 tools/ci.py collect --kind debug
      - name: Upload debug APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: A4DY-Print-debug-${{ github.sha }}
          path: artifacts/debug/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-check-reports-${{ github.sha }}
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Remove any remaining debug signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/a4dy-debug.p12"
