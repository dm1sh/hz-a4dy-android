name: Release APK

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize reruns of one tag, but never cancel a release already in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and sign release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require a version tag matching the source
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo 'Run this workflow against a v<versionName> tag, not a branch.' >&2; exit 1; }
          python3 tools/ci.py version --tag "$RELEASE_TAG"
          python3 -m unittest discover -s tools/tests -v
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Validate wrapper and restore read-only Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - name: Compile host and device tests
        run: ./gradlew --no-daemon --console=plain :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin
      - name: Run core and Android host tests
        run: ./gradlew --no-daemon --console=plain :core:test :app:testDebugUnitTest
      - name: Lint release variant
        run: ./gradlew --no-daemon --console=plain :app:lintRelease
      - name: Restore signing key and build release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          A4DY_RELEASE_KEYSTORE: ${{ runner.temp }}/a4dy-release.p12
          A4DY_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          A4DY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          A4DY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$A4DY_RELEASE_KEYSTORE"' EXIT
          python3 tools/ci.py restore-key --kind release
          ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Verify release identity, APK signature and alignment
        run: python3 tools/ci.py collect --kind release
      - name: Upload signed release and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: A4DY-Print-${{ github.ref_name }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-check-reports-${{ github.ref_name }}
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Remove any remaining release signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/a4dy-release.p12"

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download only the verified release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: A4DY-Print-${{ github.ref_name }}
          path: release
      - name: Check downloaded checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish APK, signature report, build metadata and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "A4DY Print $VERSION_NAME" --generate-notes)
          if [[ "$IS_PRERELEASE" = true ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" "${args[@]}" release/*
          fi
